<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#0E1629"/>
  
  <!-- Block Rush logo blocks -->
  <!-- Row 1: 3 blocks -->
  <rect x="12" y="12" width="30" height="30" rx="6" fill="#FF6347"/>
  <rect x="49" y="12" width="30" height="30" rx="6" fill="#00E5FF"/>
  <rect x="86" y="12" width="30" height="30" rx="6" fill="#77FF00"/>
  
  <!-- Row 2: 2 blocks (offset for visual interest) -->
  <rect x="30" y="49" width="30" height="30" rx="6" fill="#B222FF"/>
  <rect x="67" y="49" width="30" height="30" rx="6" fill="#FFD700"/>
  
  <!-- Row 3: 3 blocks -->
  <rect x="12" y="86" width="30" height="30" rx="6" fill="#00E5FF"/>
  <rect x="49" y="86" width="30" height="30" rx="6" fill="#FF6347"/>
  <rect x="86" y="86" width="30" height="30" rx="6" fill="#B222FF"/>
  
  <!-- Highlight overlays -->
  <rect x="12" y="12" width="30" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="49" y="12" width="30" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="86" y="12" width="30" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
</svg>

