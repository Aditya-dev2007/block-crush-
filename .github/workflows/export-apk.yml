name: Build Android APK and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Platforms and Build-Tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Install Godot 4.7
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install Godot 4.7 Export Templates
        run: |
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p /tmp/tpz_extracted
          unzip -q templates.tpz -d /tmp/tpz_extracted
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          if [ -d /tmp/tpz_extracted/templates ]; then
            mv /tmp/tpz_extracted/templates/* ~/.local/share/godot/export_templates/4.7.stable/
          else
            mv /tmp/tpz_extracted/* ~/.local/share/godot/export_templates/4.7.stable/
          fi
          mkdir -p ~/.local/share/godot/templates
          cp -r ~/.local/share/godot/export_templates/4.7.stable ~/.local/share/godot/templates/4.7.stable

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          ls -lh "$HOME/.android/debug.keystore"

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          python3 -c "
          import os
          sdk = os.environ.get('ANDROID_HOME', '/usr/local/lib/android/sdk')
          java = os.environ.get('JAVA_HOME', '/usr/lib/jvm/temurin-17-jdk-amd64')
          home = os.environ.get('HOME', '/home/runner')
          lines = [
              '[gd_resource type=\"EditorSettings\" format=3]',
              '',
              '[resource]',
              f'export/android/android_sdk_path = \"{sdk}\"',
              f'export/android/java_sdk_path = \"{java}\"',
              f'export/android/debug_keystore = \"{home}/.android/debug.keystore\"',
              'export/android/debug_keystore_pass = \"android\"',
              'export/android/force_system_user = false',
          ]
          cfg_path = os.path.expanduser('~/.config/godot/editor_settings-4.tres')
          with open(cfg_path, 'w') as f:
              f.write('\n'.join(lines) + '\n')
          "
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.4.tres
          cat ~/.config/godot/editor_settings-4.tres

      - name: Export Android APK
        run: |
          LATEST_BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          export PATH="$LATEST_BUILD_TOOLS:$ANDROID_HOME/platform-tools:$PATH"
          echo "Using Android Build Tools: $LATEST_BUILD_TOOLS"
          echo "apksigner located at: $(which apksigner || true)"
          echo "zipalign located at: $(which zipalign || true)"
          cd block_rush_game
          mkdir -p build
          godot -v --headless --export-debug "Android" build/BLOCK_RUSH.apk 2>&1 | tee ../export.log || EXPORT_CODE=$?
          cd ..
          echo "### 📋 Godot Export Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 export.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -n "$EXPORT_CODE" ] || [ ! -f block_rush_game/build/BLOCK_RUSH.apk ]; then
            echo "::error::Godot Android export failed!"
            exit 1
          fi
          ls -lh block_rush_game/build/BLOCK_RUSH.apk

      - name: Upload Export Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK_RUSH.apk
          path: block_rush_game/build/BLOCK_RUSH.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "BLOCK RUSH v1.0.0 (Android APK)"
          draft: false
          prerelease: false
          files: block_rush_game/build/BLOCK_RUSH.apk
          body: |
            # 🎮 BLOCK RUSH v1.0.0 — Official Android Release

            ## 📥 Direct APK Download:
            👉 **[Download BLOCK_RUSH.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/BLOCK_RUSH.apk)**

            ---

            ## 🌐 Play Online on Mobile Browser (No install needed!):
            👉 **[Play BLOCK RUSH in Browser](https://aditya-dev2007.github.io/block-crush-/)**

            ---

            ## 📲 How to Install on your Android Phone:
            1. **Download**: Tap the `BLOCK_RUSH.apk` link above directly from your phone's browser (Chrome, Samsung Internet, etc.).
            2. **Open**: When downloaded, tap the download notification or go to your **Files** / **Downloads** app and tap **BLOCK_RUSH.apk**.
            3. **Allow Installation**:
               - If Android displays *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings**.
               - Turn **ON** the switch for **"Allow from this source"**.
               - Press the **Back** button.
            4. **Install**: Tap **Install**.
            5. **Play**: Tap **Open** and start crushing blocks! 🎉

            ---

            ## ✨ Features Included:
            - **Endless Classic Mode**: 8×8 block grid, multi-line combo clears, dynamic score multipliers.
            - **Daily Challenge Mode**: Daily seeded puzzles with goal target scores and streak tracking.
            - **Harmonic Audio**: Real-time synthesized retro chord sounds and combo pitch escalations.
            - **Juicy UI & Visual FX**: 3D beveled tiles, bouncy score popups, and screen shake.
            - **Auto-Save**: Highest scores, statistics, and daily streak saved locally.
